name: Build wheels

on:
  workflow_dispatch:
  push:
    paths:
      - "Interfaces/PythonHFM/**"
      - "Interfaces/common.cmake"
      - "Headers/**"
      - "JMM_CPPLibs/**"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths:
      - "Interfaces/PythonHFM/**"
      - ".github/workflows/wheels.yml"

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
#          - ubuntu-latest          # manylinux x86_64
          - macos-14               # Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse Interfaces/PythonHFM 

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl